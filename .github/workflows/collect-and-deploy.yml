name: Collect leaderboard and deploy Pages

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Deploy the static page without collecting a new snapshot"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect a public snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
        run: python scripts/update_leaderboard.py
        env:
          PRIVATE_AGENT_LABELS: ${{ secrets.PRIVATE_AGENT_LABELS }}

      - name: Save snapshot history to the repository
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/data/leaderboard.json; then
            git add docs/data/leaderboard.json
            git commit -m "Update public leaderboard snapshots"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy the static site
        id: deployment
        uses: actions/deploy-pages@v4
